<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem - Sistema Agro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>Sistema Agro</h1>
        <nav>
            <a href="/">Início</a>
            <a href="/listagem">Listagem</a>
        </nav>
    </header>

    <main>
        <h2>Listagem de Produtos</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Preço</th>
                    <th>Total</th>
                </tr>
            </thead>

            <tbody>
                {% for produto in produtos %}
                <tr>
                    <td>{{ produto.id }}</td>
                    <td>{{ produto.nome }}</td>
                    <td>{{ produto.quantidade }}</td>
                    <td>R$ {{ produto.preco }}</td>
                    <td>R$ {{ produto.quantidade * produto.preco }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <a href="/" class="botao">Voltar</a>
    </main>

</body>
</html>
