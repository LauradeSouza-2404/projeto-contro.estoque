{% extends "base.html" %}

{% block title %}Cultiva+ | Cadastrar Produto{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Cadastrar produto</h1>

    <p>Preencha os dados do defensivo agrícola.</p>

    <form method="POST">

        <label for="nome">Nome do produto</label>
        <input
            type="text"
            id="nome"
            name="nome"
            required
        >

        <label for="principio_ativo">Princípio ativo</label>
        <input
            type="text"
            id="principio_ativo"
            name="principio_ativo"
            required
        >

        <label for="fabricante">Fabricante</label>
        <input
            type="text"
            id="fabricante"
            name="fabricante"
        >

        <label for="quantidade">Quantidade</label>
        <input
            type="number"
            id="quantidade"
            name="quantidade"
            step="0.01"
            min="0"
            required
        >

        <label for="unidade">Unidade</label>

        <select
            id="unidade"
            name="unidade"
            required
        >
            <option value="">Selecione</option>
            <option value="L">Litros (L)</option>
            <option value="kg">Quilogramas (kg)</option>
            <option value="un">Unidades</option>
        </select>

        <label for="periodo_carencia">
            Período de carência (dias)
        </label>

        <input
            type="number"
            id="periodo_carencia"
            name="periodo_carencia"
            min="0"
            required
        >

        <div class="form-actions">

            <a
                href="{{ url_for('estoque') }}"
                class="btn secondary"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="btn"
            >
                Cadastrar produto
            </button>

        </div>

    </form>

</div>

{% endblock %}
