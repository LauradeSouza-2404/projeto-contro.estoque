{% extends "base.html" %}

{% block title %}
Cultiva+ | Editar Produto
{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Editar produto</h1>

    <p>Atualize os dados do defensivo agrícola.</p>

    <form method="POST">

        <label for="nome">Nome do produto</label>
        <input
            type="text"
            id="nome"
            name="nome"
            value="{{ produto['nome'] }}"
            required
        >

        <label for="principio_ativo">Princípio ativo</label>
        <input
            type="text"
            id="principio_ativo"
            name="principio_ativo"
            value="{{ produto['principio_ativo'] }}"
            required
        >

        <label for="fabricante">Fabricante</label>
        <input
            type="text"
            id="fabricante"
            name="fabricante"
            value="{{ produto['fabricante'] or '' }}"
        >

        <label for="unidade">Unidade</label>

        <select
            id="unidade"
            name="unidade"
            required
        >
            <option value="">Selecione</option>

            <option value="L"
                {% if produto['unidade'] == 'L' %}selected{% endif %}>
                Litros (L)
            </option>

            <option value="kg"
                {% if produto['unidade'] == 'kg' %}selected{% endif %}>
                Quilogramas (kg)
            </option>

            <option value="un"
                {% if produto['unidade'] == 'un' %}selected{% endif %}>
                Unidades
            </option>
        </select>

        <label for="periodo_carencia">
            Período de carência (dias)
        </label>

        <input
            type="number"
            id="periodo_carencia"
            name="periodo_carencia"
            min="0"
            value="{{ produto['periodo_carencia'] }}"
            required
        >

        <div class="form-actions">

            <a
                href="{{ url_for('estoque') }}"
                class="botao"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="botao"
            >
                Salvar alterações
            </button>

        </div>

    </form>

</div>

{% endblock %}
