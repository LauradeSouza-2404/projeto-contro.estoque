{% extends "base.html" %}

{% block title %}Cadastrar Talhão{% endblock %}

{% block content %}

<h1>Cadastrar Talhão</h1>

<form method="POST">

<label>Nome do talhão:</label>
<input type="text" name="nome" required>

<label>Área (hectares):</label>
<input type="number" name="area" step="0.01" required>

<label>Cultura:</label>
<input type="text" name="cultura" required>

<br>

<button type="submit" class="botao">
    Cadastrar
</button>
</form>

{% endblock %}
