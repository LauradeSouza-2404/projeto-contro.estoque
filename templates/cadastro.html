<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Cultiva+</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .cadastro-container {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #2e7d32;
            color: white;
            font-size: 16px;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #2e7d32;
        }
    </style>
</head>

<body>

<div class="cadastro-container">

    <h1>🌱 Criar conta</h1>

    <form method="POST">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required>

        <button type="submit">Cadastrar</button>

    </form>

    <div class="login">
        Já possui uma conta?
        <br>
        <a href="{{ url_for('login') }}">Voltar para o login</a>
    </div>

</div>

</body>
</html>
