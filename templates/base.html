<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Cultiva+{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <header>

        <nav>

            <a href="{{ url_for('index') }}" class="logo">
                Cultiva+
            </a>

            <div class="menu">

                <a href="{{ url_for('index') }}">
                    Início
                </a>

                <a href="{{ url_for('aplicacoes') }}">
                    Aplicações
                </a>

                <a href="{{ url_for('nova_aplicacao') }}">
                    Nova aplicação
                </a>

            </div>

        </nav>

    </header>

    <main>

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
