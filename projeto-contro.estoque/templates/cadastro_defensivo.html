<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Defensivo</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="container">

        <h1>Cadastro de Defensivos</h1>

        <p>
            Cadastre os defensivos utilizados no controle de estoque.
        </p>

        <form action="/cadastrar" method="POST">

            <label for="nome">Nome do defensivo:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="principio_ativo">Princípio ativo:</label>
            <input type="text" id="principio_ativo" name="principio_ativo" required>

            <label for="fabricante">Fabricante:</label>
            <input type="text" id="fabricante" name="fabricante" required>

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" name="quantidade" min="0" step="0.01" required>

            <label for="unidade">Unidade de medida:</label>
            <select id="unidade" name="unidade" required>
                <option value="">Selecione</option>
                <option value="Litros">Litros</option>
                <option value="Quilogramas">Quilogramas</option>
                <option value="Unidades">Unidades</option>
            </select>

            <label for="lote">Lote:</label>
            <input type="text" id="lote" name="lote" required>

            <label for="validade">Data de validade:</label>
            <input type="date" id="validade" name="validade" required>

            <button type="submit">Cadastrar defensivo</button>

        </form>

    </main>

</body>
</html>
